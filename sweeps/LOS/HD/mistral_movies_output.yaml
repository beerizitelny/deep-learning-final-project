#   wandb sweep mistral_movies_output_sane.yaml
#   wandb agent <ENTITY>/<PROJECT>/<SWEEP_ID>

program: ./main.py

method: grid

metric:
  name: best_val_AUC
  goal: maximize

parameters:
  # ======================
  # Reproducibility
  # ======================
  seed:
    values: [0]

  # ======================
  # Training
  # ======================
  num_epochs:
    values: [300]
  batch_size:
    values: [8]
  patience:
    values: [30]

  # ======================
  # Model architecture
  # ======================
  probe_model:
    values: ["LOS-Net"]
  hidden_dim:
    values: [128, 256]
  num_layers:
    values: [1]
  heads:
    values: [8]
  dropout:
    values: [0.0]
  pool:
    values: ["cls"]

  # ======================
  # Optimization
  # ======================
  lr:
    values: [1e-4]
  weight_decay:
    values: [0, 0.001]

  # ======================
  # Dataset / Input
  # ======================
  train_dataset:
    values: ["movies"]
  test_dataset:
    values: ["movies_test"]
  input_type:
    values: ["LOS"]
  input_output_type:
    values: ["output"]

  topk_preprocess:
    values: [1000]
  topk_dim:
    values: [1000]

  rank_encoding:
    values: ["scale_encoding"]

  num_workers:
    values: [2]
  pin_memory:
    values: [1]

  # ======================
  # Cross-validation
  # ======================
  num_folds:
    values: [5]
  fold_to_run:
    values: [0]

  # ======================
  # Paths
  # ======================
  best_model_path:
    values: ["saved_models"]
  base_pre_processed_data_dir:
    values: ["/home/beerizitelny/LOS-Net/pre_processed_data"]

  # ======================
  # LLM
  # ======================
  LLM:
    values: ["mistralai/Mistral-7B-Instruct-v0.2"]